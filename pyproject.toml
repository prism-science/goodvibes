[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "goodvibes"
dynamic = ["version"]
readme = "README.md"
license = { text = "MIT" }
authors = [
    { email = "spm82@cornell.edu", name = "Steve Meisburger" },
]
requires-python = ">= 3.14"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "gemmi",
]

[project.optional-dependencies]
test = ["ruff>=0.1.0", "pytest>=6.0"]

[project.urls]
repository = "https://github.com/ando-lab/goodvibes"

[project.scripts]
"gv.version" = "goodvibes.command_line.version:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "goodvibes.__version__"}

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style= "double"
indent-style= "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "PLC", "PLE", "PLW", "I"]
ignore = ["E741", "F541"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]